<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Phantom — Phantom Road Studio</title>
<link rel="icon" href="phantom-icon.ico" type="image/x-icon">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050505;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  .intro {
    position: fixed;
    inset: 0;
    background: #050505;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    z-index: 9999;
    animation: fadeOut 1s ease 5s forwards;
  }

  .qwen-logo {
    width: 140px;
    opacity: 0;
    animation: logoIn 1.5s ease 0.3s forwards;
    background: transparent;
  }

  .intro h1 {
    font-size: 70px;
    letter-spacing: 20px;
    color: #000;
    -webkit-text-stroke: 2px #D4AF37;
    text-shadow: 0 0 30px #D4AF37, 0 0 60px #D4AF37;
    opacity: 0;
    animation: glowIn 1.5s ease 1s forwards;
  }

  .copyright {
    font-size: 14px;
    color: #888;
    letter-spacing: 2px;
    margin-top: 10px;
    opacity: 0;
    animation: glowIn 1.5s ease 2s forwards;
  }

  @keyframes logoIn {
    0% { opacity: 0; transform: scale(0.5) rotate(-10deg); filter: blur(10px); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
  }

  @keyframes glowIn {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeOut {
    0% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
  }

  .sidebar {
    width: 260px;
    background: #0a0a0a;
    border-right: 1px solid #D4AF37;
    display: flex;
    flex-direction: column;
    padding: 20px 12px;
    gap: 12px;
    z-index: 30;
  }

  .new-chat {
    background: #D4AF37;
    border: none;
    border-radius: 8px;
    padding: 12px;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  .new-chat:hover {
    background: #ff2a2a;
    color: #fff;
    box-shadow: 0 0 15px #ff2a2a;
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .chat-item {
    padding: 10px 12px;
    border-radius: 6px;
    background: #111;
    color: #ccc;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
    border: 1px solid transparent;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .chat-item:hover {
    background: #1a1a1a;
    border-color: #D4AF37;
  }

  .chat-item.active {
    background: #1a1a1a;
    border-color: #D4AF37;
    color: #D4AF37;
  }

  .chat-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .delete-chat {
    color: #555;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
  }

  .delete-chat:hover {
    color: #ff2a2a;
    text-shadow: 0 0 10px #ff2a2a;
  }

  .main {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .frame {
    position: fixed;
    inset: 15px;
    border: 2px solid #D4AF37;
    border-radius: 12px;
    pointer-events: none;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    z-index: 10;
  }

  .title {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    letter-spacing: 8px;
    color: #D4AF37;
    text-transform: uppercase;
    z-index: 5;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
  }

  .eyes {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 80px;
    z-index: 1;
    pointer-events: none;
  }

  .eye {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff2a2a 0%, #8b0000 50%, #000 100%);
    box-shadow: 0 0 40px #ff2a2a, 0 0 80px #ff2a2a, 0 0 120px #8b0000;
    position: relative;
    animation: blink 5s infinite;
  }

  .pupil {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 30px;
    background: #000;
    border-radius: 50%;
  }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  .chat {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 700px;
    display: flex;
    gap: 10px;
    z-index: 20;
    align-items: center;
  }

  .attach-wrapper {
    position: relative;
    flex-shrink: 0;
    padding: 10px;
  }

  .attach-btn {
    background: #111;
    border: 2px solid #D4AF37;
    border-radius: 8px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
    z-index: 5;
  }

  .attach-btn img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.6));
  }

  .attach-btn:hover {
    box-shadow: 0 0 20px #D4AF37;
    background: #1a1a1a;
  }

  .smoke {
    position: absolute;
    inset: -30px;
    background: radial-gradient(circle, rgba(140,140,140,0.85) 0%, rgba(90,90,90,0.5) 40%, transparent 75%);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.6s;
    pointer-events: none;
    z-index: 1;
    filter: blur(10px);
  }

  .attach-wrapper:hover .smoke {
    opacity: 1;
  }

  .phantom {
    position: absolute;
    width: 30px;
    height: 60px;
    background: rgba(200, 200, 200, 0.85);
    border-radius: 12px 12px 4px 4px;
    box-shadow: 0 0 20px rgba(220, 220, 220, 0.6);
    opacity: 0;
    pointer-events: none;
    z-index: 3;
  }

  .phantom::before {
    content: '';
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 20px;
    background: rgba(200, 200, 200, 0.9);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(220, 220, 220, 0.7);
  }

  .phantom .arms {
    position: absolute;
    top: 10px;
    left: -12px;
    width: 54px;
    height: 6px;
    background: rgba(200, 200, 200, 0.8);
    border-radius: 3px;
    box-shadow: 0 0 10px rgba(220, 220, 220, 0.5);
  }

  .phantom .legs {
    position: absolute;
    bottom: -25px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 25px;
    display: flex;
    justify-content: space-between;
  }

  .phantom .legs::before,
  .phantom .legs::after {
    content: '';
    width: 6px;
    height: 25px;
    background: rgba(200, 200, 200, 0.8);
    border-radius: 3px;
    box-shadow: 0 0 10px rgba(220, 220, 220, 0.5);
  }

  .attach-wrapper:hover .phantom {
    animation: flyAround 3s infinite;
  }

  @keyframes flyAround {
    0% { opacity: 0; top: 0; left: -10px; }
    25% { opacity: 1; top: -20px; left: 50px; }
    50% { opacity: 1; top: 50px; left: 50px; }
    75% { opacity: 1; top: 50px; left: -30px; }
    100% { opacity: 0; top: 0; left: -10px; }
  }

  .attach-menu {
    position: absolute;
    bottom: 70px;
    left: 0;
    background: #0a0a0a;
    border: 1px solid #D4AF37;
    border-radius: 8px;
    padding: 8px;
    display: none;
    flex-direction: column;
    gap: 6px;
    z-index: 100;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    pointer-events: auto;
    min-width: 180px;
  }

  .attach-wrapper:hover .attach-menu {
    display: flex;
  }

  .attach-menu button {
    background: transparent;
    border: none;
    color: #D4AF37;
    padding: 10px 14px;
    text-align: left;
    cursor: pointer;
    border-radius: 4px;
    transition: 0.2s;
    font-family: inherit;
    font-size: 14px;
  }

  .attach-menu button:hover {
    background: #1a1a1a;
    color: #fff;
  }

  .chat input[type="text"] {
    flex: 1;
    background: rgba(20, 20, 20, 0.9);
    border: 1px solid #D4AF37;
    border-radius: 8px;
    padding: 14px 18px;
    color: #fff;
    font-size: 16px;
    outline: none;
  }

  .chat input[type="text"]:focus {
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
  }

  .chat > button {
    background: #D4AF37;
    border: none;
    border-radius: 8px;
    padding: 0 24px;
    height: 48px;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  .chat > button:hover {
    background: #ff2a2a;
    color: #fff;
    box-shadow: 0 0 20px #ff2a2a;
  }

  .response {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70%;
    max-width: 800px;
    color: #eee;
    font-size: 16px;
    line-height: 1.6;
    text-align: center;
    z-index: 15;
    padding: 20px;
    background: rgba(0, 0, 0, 0.7);
    border-radius: 10px;
    display: none;
  }

  .footer {
    position: fixed;
    bottom: 10px;
    right: 20px;
    font-size: 12px;
    color: #666;
    letter-spacing: 1px;
    z-index: 5;
  }
</style>
</head>
<body>

  <div class="intro">
    <img src="qwen-logo.png" class="qwen-logo" alt="Qwen">
    <h1>PHANTOM</h1>
    <p class="copyright">© 2026 Phantom Road Studio. Все права защищены.</p>
  </div>

  <div class="sidebar">
    <button class="new-chat" onclick="newChat()">+ Новый чат</button>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="main">
    <div class="frame"></div>
    <div class="title">PHANTOM ROAD STUDIO</div>

    <div class="eyes">
      <div class="eye"><div class="pupil"></div></div>
      <div class="eye"><div class="pupil"></div></div>
    </div>

    <div class="response" id="response"></div>

    <div class="chat">
      <div class="attach-wrapper">
        <div class="smoke"></div>
        <div class="phantom">
          <div class="arms"></div>
          <div class="legs"></div>
        </div>
        <button class="attach-btn">
          <img src="qwen-logo.png" alt="+">
        </button>
        <div class="attach-menu">
          <button onclick="document.getElementById('fileInput').click()">🖼 Картинка</button>
          <button onclick="document.getElementById('fileInput').click()">🎵 Музыка</button>
          <button onclick="document.getElementById('fileInput').click()">📄 Документ</button>
          <button onclick="document.getElementById('fileInput').click()">📎 Всё</button>
        </div>
      </div>
      <input type="file" id="fileInput" style="display:none" onchange="handleFile(event)">
      <input type="text" id="message" placeholder="Введите сообщение..." autofocus>
      <button onclick="send()">Отправить</button>
    </div>

    <div class="footer">© 2026 Phantom Road Studio</div>
  </div>

<script>
  let chats = [];
  let currentChatId = null;

  async function loadChats() {
    try {
      const res = await fetch('http://localhost:8080/api/chats');
      chats = await res.json();
    } catch (e) {
      chats = [];
    }
    if (chats.length === 0) newChat();
    renderChatList();
  }

  async function saveChats() {
    try {
      await fetch('http://localhost:8080/api/chats', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(chats)
      });
    } catch (e) {}
  }

  function renderChatList() {
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    chats.forEach(chat => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');

      const title = document.createElement('span');
      title.className = 'chat-title';
      title.textContent = chat.title || 'Новый чат';
      title.onclick = () => loadChat(chat.id);

      const del = document.createElement('span');
      del.className = 'delete-chat';
      del.textContent = '✕';
      del.onclick = (e) => {
        e.stopPropagation();
        deleteChat(chat.id);
      };

      item.appendChild(title);
      item.appendChild(del);
      list.appendChild(item);
    });
  }

  function deleteChat(id) {
    chats = chats.filter(c => c.id !== id);
    if (currentChatId === id) {
      if (chats.length > 0) {
        currentChatId = chats[0].id;
        loadChat(currentChatId);
      } else {
        newChat();
        return;
      }
    }
    saveChats();
    renderChatList();
  }

  function newChat() {
    const chat = {
      id: Date.now(),
      title: 'Новый чат',
      messages: []
    };
    chats.push(chat);
    currentChatId = chat.id;
    saveChats();
    renderChatList();
    document.getElementById('response').style.display = 'none';
  }

  function loadChat(id) {
    currentChatId = id;
    renderChatList();
    const chat = chats.find(c => c.id === id);
    if (chat && chat.messages.length > 0) {
      const last = chat.messages[chat.messages.length - 1];
      const responseDiv = document.getElementById('response');
      responseDiv.style.display = 'block';
      responseDiv.textContent = last.text;
    } else {
      document.getElementById('response').style.display = 'none';
    }
  }

  async function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (!currentChatId) newChat();

    const responseDiv = document.getElementById('response');
    responseDiv.style.display = 'block';
    responseDiv.textContent = '📎 Обрабатываю: ' + file.name + '...';

    try {
      const arrayBuffer = await file.arrayBuffer();
      const res = await fetch('http://localhost:8080/api/upload', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/octet-stream',
          'X-Filename': encodeURIComponent(file.name)
        },
        body: arrayBuffer
      });
      const data = await res.json();
      let text = data.text;

      const chat = chats.find(c => c.id === currentChatId);

      if (text.startsWith('[IMAGE]') && text.endsWith('[/IMAGE]')) {
        responseDiv.textContent = '📎 Квен смотрит на картинку...';
        const imgData = text.replace('[IMAGE]', '').replace('[/IMAGE]', '');

        // Шаг 1: LLaVA описывает картинку
        const llavaRes = await fetch('http://localhost:11434/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'llava-llama3',
            prompt: 'Опиши подробно, что ты видишь на этом изображении. Отвечай на английском.',
            images: [imgData],
            stream: false
          })
        });
        const llavaData = await llavaRes.json();
        const englishDesc = llavaData.response;

        // Шаг 2: Qwen переводит с базой знаний
        responseDiv.textContent = '📎 Квен думает по-русски...';
        const qwenRes = await fetch('http://localhost:11434/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'qwen2.5',
            prompt: 'Ты — Квен, инженер-оптимизатор Phantom Road Studio. Отвечай ТОЛЬКО на русском языке. Вот что ты знаешь о студии и проекте: Phantom Road Studio — игровая студия. Логотип: фантом в капюшоне, золотой контур, красные глаза. Проект: NWS (Need World Speed) — уличные гонки. Персонажи: Кирилл, команда, боссы. Машины: Lancer, Mustang, BMW, Mazda. Локации: Москва, Минск, Арбат, кольцевая. Теперь опиши изображение: ' + englishDesc,
            stream: false
          })
        });
        const qwenData = await qwenRes.json();
        text = qwenData.response;
      } else {
        chat.messages.push({ role: 'user', text: '📎 ' + file.name + '\n\n' + text });
        responseDiv.textContent = '📎 Файл распознан. Квен думает...';
        const aiRes = await fetch('http://localhost:11434/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'qwen2.5',
            prompt: 'Ты — Квен, инженер-оптимизатор команды Phantom Road Studio. Пользователь прислал файл. Вот его содержимое: ' + text + '\n\nПрокомментируй это кратко, по-русски, по делу.',
            stream: false
          })
        });
        const aiData = await aiRes.json();
        text = aiData.response;
      }

      chat.messages.push({ role: 'ai', text: text });
      responseDiv.textContent = text;
      saveChats();
      renderChatList();
    } catch (e) {
      responseDiv.textContent = 'Ошибка: ' + e.message;
    }
  }

  async function send() {
    const input = document.getElementById('message');
    const text = input.value.trim();
    if (!text) return;

    if (!currentChatId) newChat();

    const chat = chats.find(c => c.id === currentChatId);
    chat.messages.push({ role: 'user', text });
    if (chat.messages.length === 1) {
      chat.title = text.slice(0, 30);
    }

    const responseDiv = document.getElementById('response');
    responseDiv.style.display = 'block';
    responseDiv.textContent = '...';

    try {
      const res = await fetch('http://localhost:11434/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'qwen2.5',
          prompt: 'Ты — Квен, инженер-оптимизатор команды Phantom Road Studio. Ты помогаешь с кодом, системой, настройкой и оптимизацией. Общайся на «ты», по-русски, кратко и по делу. Если не знаешь — скажи «не знаю». ' + text,
          stream: false
        })
      });
      const data = await res.json();
      responseDiv.textContent = data.response;
      chat.messages.push({ role: 'ai', text: data.response });
    } catch (e) {
      responseDiv.textContent = 'Ошибка: Ollama не запущен.';
    }

    saveChats();
    renderChatList();
    input.value = '';
  }

  document.getElementById('message').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') send();
  });

  loadChats();
</script>

</body>
</html>
