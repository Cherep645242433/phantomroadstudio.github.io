<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Phantom — Phantom Road Studio</title>
<link rel="icon" href="phantom-icon.ico" type="image/x-icon">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050505; color:#fff; font-family:'Segoe UI',sans-serif; height:100vh; overflow:hidden; display:flex; }
.intro { position:fixed; inset:0; background:#050505; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; z-index:9999; animation:fadeOut 1s ease 3s forwards; }
.qwen-logo { width:140px; opacity:0; animation:logoIn 1.5s ease 0.3s forwards; }
.intro h1 { font-size:70px; letter-spacing:20px; color:#000; -webkit-text-stroke:2px #D4AF37; text-shadow:0 0 30px #D4AF37,0 0 60px #D4AF37; opacity:0; animation:glowIn 1.5s ease 0.3s forwards; }
.copyright { font-size:14px; color:#888; letter-spacing:2px; opacity:0; animation:glowIn 1.5s ease 1s forwards; }
@keyframes logoIn { from{opacity:0;transform:scale(0.5) rotate(-10deg);filter:blur(10px);} to{opacity:1;transform:scale(1) rotate(0deg);filter:blur(0);} }
@keyframes glowIn { from{opacity:0;transform:scale(0.8);} to{opacity:1;transform:scale(1);} }
@keyframes fadeOut { to{opacity:0;visibility:hidden;} }
.sidebar { width:260px; background:#0a0a0a; border-right:1px solid #D4AF37; display:flex; flex-direction:column; padding:20px 12px; gap:12px; z-index:30; }
.assistant-tabs { display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
.assistant-tabs button { background:#111; border:1px solid #333; color:#888; border-radius:6px; padding:8px 12px; font-size:13px; cursor:pointer; transition:0.2s; font-family:inherit; text-align:left; }
.assistant-tabs button:hover { border-color:#D4AF37; color:#D4AF37; }
.assistant-tabs button.active { background:#D4AF37; color:#000; font-weight:bold; border-color:#D4AF37; }
.new-chat { background:#D4AF37; border:none; border-radius:8px; padding:12px; color:#000; font-weight:bold; cursor:pointer; transition:0.3s; }
.new-chat:hover { background:#ff2a2a; color:#fff; box-shadow:0 0 15px #ff2a2a; }
.chat-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
.chat-item { padding:10px 12px; border-radius:6px; background:#111; color:#ccc; cursor:pointer; font-size:14px; display:flex; justify-content:space-between; gap:8px; border:1px solid transparent; }
.chat-item:hover, .chat-item.active { background:#1a1a1a; border-color:#D4AF37; }
.chat-item.active { color:#D4AF37; }
.chat-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.delete-chat:hover { color:#ff2a2a; }
.main { flex:1; position:relative; display:flex; flex-direction:column; }
.frame { position:fixed; inset:15px; border:2px solid #D4AF37; border-radius:12px; pointer-events:none; box-shadow:0 0 20px rgba(212,175,55,0.4); z-index:10; }
.title { position:fixed; top:40px; left:50%; transform:translateX(-50%); font-size:24px; letter-spacing:8px; color:#D4AF37; text-transform:uppercase; z-index:5; text-shadow:0 0 10px rgba(212,175,55,0.6); }
.eyes { position:fixed; top:22%; left:50%; transform:translate(-50%,-50%); display:flex; gap:80px; z-index:0; pointer-events:none; opacity:0.35; }
.eye { width:60px; height:60px; border-radius:50%; background:radial-gradient(circle,#ff2a2a 0%,#8b0000 50%,#000 100%); box-shadow:0 0 40px #ff2a2a; position:relative; animation:blink 5s infinite; }
.pupil { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:6px; height:26px; background:#000; border-radius:50%; }
@keyframes blink { 0%,92%,100%{transform:scaleY(1);} 95%{transform:scaleY(0.1);} }
.chat-log { flex:1; margin:90px 20px 130px 20px; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; z-index:15; position:relative; transition:margin-bottom 0.2s; }
.chat-log.player-open { margin-bottom:210px; }
.msg { max-width:78%; padding:12px 16px; border-radius:10px; line-height:1.5; font-size:15px; white-space:pre-wrap; word-wrap:break-word; }
.msg.user { align-self:flex-end; background:rgba(30,58,95,0.85); border:1px solid rgba(212,175,55,0.4); }
.msg.ai { align-self:flex-start; background:rgba(15,15,15,0.9); border:1px solid #D4AF37; color:#eee; }
.msg.system { align-self:center; background:rgba(212,175,55,0.15); border:1px solid #D4AF37; color:#D4AF37; font-size:13px; max-width:90%; text-align:center; }
.msg .label { display:block; font-size:11px; color:#D4AF37; letter-spacing:1px; margin-bottom:4px; text-transform:uppercase; }
.msg img.chat-img { max-width:320px; max-height:320px; border-radius:8px; margin-top:6px; display:block; cursor:pointer; }
.player-box { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); width:80%; max-width:700px; background:rgba(10,10,10,0.95); border:1px solid #D4AF37; border-radius:10px; padding:10px 14px; z-index:20; display:none; box-shadow:0 0 20px rgba(212,175,55,0.4); }
.player-box.visible { display:block; }
.player-box .row1 { display:flex; align-items:center; gap:10px; }
.player-box .track-name { flex:1; color:#D4AF37; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player-box .close-btn { background:transparent; border:1px solid #D4AF37; color:#D4AF37; width:26px; height:26px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.player-box .close-btn:hover { background:#ff2a2a; color:#fff; border-color:#ff2a2a; }
.player-box audio { width:100%; outline:none; margin-top:8px; }
.chat-bar { position:fixed; bottom:40px; left:50%; transform:translateX(-50%); width:80%; max-width:700px; display:flex; flex-direction:column; gap:8px; z-index:20; }
.input-row { display:flex; gap:10px; align-items:center; }
.attach-wrapper { position:relative; flex-shrink:0; }
.attach-btn { background:#111; border:2px solid #D4AF37; border-radius:8px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.3s; }
.attach-btn img { width:32px; height:32px; object-fit:contain; }
.attach-btn:hover { box-shadow:0 0 20px #D4AF37; background:#1a1a1a; }
.attach-menu { position:absolute; bottom:60px; left:0; background:#0a0a0a; border:1px solid #D4AF37; border-radius:8px; padding:8px; display:none; flex-direction:column; gap:6px; min-width:220px; box-shadow:0 0 20px rgba(212,175,55,0.4); }
.attach-menu.open { display:flex; }
.attach-menu button { background:transparent; border:none; color:#D4AF37; padding:10px 14px; text-align:left; cursor:pointer; border-radius:4px; font-family:inherit; font-size:14px; }
.attach-menu button:hover { background:#1a1a1a; color:#fff; }
input[type="text"] { flex:1; background:rgba(20,20,20,0.9); border:1px solid #D4AF37; border-radius:8px; padding:14px 18px; color:#fff; font-size:16px; outline:none; }
input[type="text"]:focus { box-shadow:0 0 15px rgba(212,175,55,0.6); }
.send-btn { background:#D4AF37; border:none; border-radius:8px; padding:0 24px; height:48px; color:#000; font-weight:bold; cursor:pointer; transition:0.3s; }
.send-btn:hover { background:#ff2a2a; color:#fff; box-shadow:0 0 20px #ff2a2a; }
.send-btn:disabled { opacity:0.4; cursor:not-allowed; }
.footer { position:fixed; bottom:22px; right:32px; font-size:12px; color:#666; letter-spacing:1px; z-index:100; }
.img-lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:9998; display:none; align-items:center; justify-content:center; cursor:zoom-out; }
.img-lightbox.visible { display:flex; }
.img-lightbox img { max-width:92%; max-height:92%; border:2px solid #D4AF37; border-radius:12px; }
</style>
</head>
<body>

  <div class="intro">
    <img src="qwen-logo.png" class="qwen-logo" alt="Qwen">
    <h1>PHANTOM</h1>
    <p class="copyright">© 2026 Phantom Road Studio. Все права защищены.</p>
  </div>

  <div class="sidebar">
    <div class="assistant-tabs" id="assistantTabs">
      <button data-a="Qwen" onclick="switchAssistant('Qwen')">● Qwen</button>
      <button data-a="Claude" onclick="switchAssistant('Claude')">○ Claude</button>
      <button data-a="Alice" onclick="switchAssistant('Alice')">○ Alice</button>
      <button data-a="DeepSeek" onclick="switchAssistant('DeepSeek')">○ DeepSeek</button>
    </div>
    <button class="new-chat" onclick="newChat()">+ Новый чат</button>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="main">
    <div class="frame"></div>
    <div class="title">PHANTOM ROAD STUDIO</div>
    <div class="eyes">
      <div class="eye"><div class="pupil"></div></div>
      <div class="eye"><div class="pupil"></div></div>
    </div>
    <div class="chat-log" id="chatLog"></div>

    <div class="player-box" id="playerBox">
      <div class="row1">
        <div class="track-name" id="trackName">—</div>
        <button class="close-btn" onclick="closePlayer()" title="Закрыть плеер">✕</button>
      </div>
      <audio id="player" controls></audio>
    </div>

    <div class="chat-bar">
      <div class="input-row">
        <div class="attach-wrapper">
          <button class="attach-btn" id="attachBtn" onclick="toggleAttachMenu(event)"><img src="qwen-logo.png" alt="+"></button>
          <div class="attach-menu" id="attachMenu">
            <button onclick="pickFile('imageInput')">🖼 Картинка</button>
            <button onclick="pickFile('musicInput')">🎵 Музыка</button>
            <button onclick="pickFile('docInput')">📄 Документ</button>
          </div>
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImage(event)">
        <input type="file" id="musicInput" accept="audio/*" style="display:none" onchange="handleMusic(event)">
        <input type="file" id="docInput" accept=".txt,.md,.json,.js,.html,.css,.py,.pdf,.docx,.doc,.xlsx,.xls,.csv" style="display:none" onchange="handleDoc(event)">
        <input type="text" id="message" placeholder="Введите сообщение..." autofocus>
        <button class="send-btn" id="sendBtn" onclick="send()">Отправить</button>
      </div>
    </div>

    <div class="footer">© 2026 Phantom Road Studio</div>
  </div>

  <div class="img-lightbox" id="imgLightbox" onclick="closeLightbox()">
    <img id="imgLightboxImg" src="">
  </div>

  <script src="jszip.min.js"></script>
  <script src="xlsx.min.js"></script>
  <script src="pdf.min.js"></script>
<script>
const VERSION = '1.6';
const ASSISTANTS = {
  Qwen:     { model: 'qwen2.5',          prompt: 'Ты — Квен, инженер-оптимизатор Phantom Road Studio. Помогаешь с кодом, системой, настройкой. Отвечай кратко и по делу.' },
  Claude:   { model: 'gemma2:9b',        prompt: 'Ты — Клод, вдумчивый аналитик Phantom Road Studio. Отвечай точно и по делу, грамотным русским языком. Не выдумывай слова, которых нет в русском.' },
  Alice:    { model: 'qwen2.5',          prompt: 'Ты — Алиса, дружелюбная помощница Phantom Road Studio. Отвечай тепло, но по существу.' },
  DeepSeek: { model: 'deepseek-r1:7b',   prompt: 'Ты — DeepSeek, напарник Phantom Road Studio. Отвечай ТОЛЬКО на текущее сообщение. Не упоминай посторонние темы, если не спросили. Отвечай живо, коротко, по-русски, без официоза.' }
};
const SYSTEM_RU = 'Ты общаешься ТОЛЬКО на русском языке. Категорически запрещено использовать китайские, японские, корейские иероглифы и любые слова не на русском. Только русский.';

const GITHUB_RAW = 'https://raw.githubusercontent.com/Cherep645242433/phantomroadstudio.github.io/main';

let current = 'Qwen';
let chats = [];
let currentChatId = null;
let knowledgeText = '';
let deepseekText = '';
let pendingImage = null;

const chatLog = document.getElementById('chatLog');
const messageEl = document.getElementById('message');
const sendBtn = document.getElementById('sendBtn');
const playerBox = document.getElementById('playerBox');
const player = document.getElementById('player');
const trackName = document.getElementById('trackName');

function cleanFromCJK(text) {
  if (!text) return text;
  return text.replace(/[\u4e00-\u9fff\u3400-\u4dbf\u3040-\u30ff\uac00-\ud7af\uff00-\uffef]+/g, '').replace(/[ \t]{2,}/g, ' ').trim();
}
async function pyLoadChats(assistant) {
  try {
    if (window.pywebview && window.pywebview.api) {
      const raw = await window.pywebview.api.load_chats(assistant);
      return JSON.parse(raw);
    }
  } catch (e) { console.warn('pyLoadChats', e); }
  try { return JSON.parse(localStorage.getItem('phantom_chats_' + assistant.toLowerCase())) || []; }
  catch (e) { return []; }
}
async function pySaveChats(assistant, data) {
  try {
    if (window.pywebview && window.pywebview.api) {
      await window.pywebview.api.save_chats(assistant, JSON.stringify(data));
      return;
    }
  } catch (e) { console.warn('pySaveChats', e); }
  localStorage.setItem('phantom_chats_' + assistant.toLowerCase(), JSON.stringify(data));
}
async function pyLoadKnowledge() {
  try {
    if (window.pywebview && window.pywebview.api) return await window.pywebview.api.load_knowledge();
  } catch (e) {}
  return localStorage.getItem('phantom_knowledge') || '';
}
async function pyLoadDeepseek() {
  try {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.load_deepseek) {
      return await window.pywebview.api.load_deepseek();
    }
  } catch (e) {}
  return localStorage.getItem('phantom_deepseek') || '';
}
async function loadChats() {
  chats = await pyLoadChats(current);
  if (!chats.length) { newChat(); }
  else { currentChatId = chats[0].id; renderChatList(); renderChatLog(); }
}
async function saveChats() { await pySaveChats(current, chats); }
function newChat() {
  stopPlayer(); pendingImage = null;
  const chat = { id: Date.now(), title: 'Новый чат', messages: [] };
  chats.unshift(chat); currentChatId = chat.id;
  saveChats(); renderChatList(); renderChatLog();
}
function selectChat(id) { stopPlayer(); pendingImage = null; currentChatId = id; renderChatList(); renderChatLog(); }
function deleteChat(id, e) {
  e.stopPropagation();
  chats = chats.filter(c => c.id !== id);
  if (currentChatId === id) { if (chats.length) currentChatId = chats[0].id; else return newChat(); }
  saveChats(); renderChatList(); renderChatLog();
}
function getActiveChat() { return chats.find(c => c.id === currentChatId); }
function switchAssistant(name) {
  current = name; stopPlayer(); pendingImage = null;
  document.querySelectorAll('#assistantTabs button').forEach(b => {
    const a = b.dataset.a;
    b.classList.toggle('active', a === name);
    b.textContent = (a === name ? '● ' : '○ ') + a;
  });
  loadChats();
}
function openPlayer(name, src) {
  player.src = src;
  trackName.textContent = '🎵 ' + name;
  playerBox.classList.add('visible');
  chatLog.classList.add('player-open');
  player.play().catch(() => {});
}
function closePlayer() { stopPlayer(); }
function stopPlayer() {
  if (player) { player.pause(); player.src = ''; }
  if (playerBox) playerBox.classList.remove('visible');
  if (chatLog) chatLog.classList.remove('player-open');
}
function renderChatList() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  chats.forEach(c => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
    div.onclick = () => selectChat(c.id);
    div.innerHTML = '<span class="chat-title">' + escapeHtml(c.title) + '</span><span class="delete-chat">✕</span>';
    div.querySelector('.delete-chat').onclick = (e) => deleteChat(c.id, e);
    list.appendChild(div);
  });
}
function renderChatLog() {
  chatLog.innerHTML = '';
  const c = getActiveChat();
  if (!c) return;
  c.messages.forEach(m => {
    const div = appendMsg(m.role, m.text, m.assistant, m.system);
    if (m.image) {
      const img = document.createElement('img');
      img.className = 'chat-img';
      img.src = m.image;
      img.onclick = () => showLightbox(m.image);
      div.appendChild(img);
    }
  });
  chatLog.scrollTop = chatLog.scrollHeight;
}
function appendMsg(role, text, assistant, isSystem) {
  const div = document.createElement('div');
  div.className = 'msg ' + (isSystem ? 'system' : role === 'user' ? 'user' : 'ai');
  if (role === 'ai' && assistant && !isSystem) {
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = assistant;
    div.appendChild(label);
  }
  const span = document.createElement('span');
  span.textContent = text;
  div.appendChild(span);
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function showLightbox(src) {
  document.getElementById('imgLightboxImg').src = src;
  document.getElementById('imgLightbox').classList.add('visible');
}
function closeLightbox() { document.getElementById('imgLightbox').classList.remove('visible'); }

async function askOllama(prompt, model) {
  let numPredict = 4096;
  let numCtx = 8192;
  let numGpu = null;

  if (model === 'gemma2:9b' || model === 'llama3.1:8b') {
    numGpu = 0;
    numPredict = 2048;
    numCtx = 4096;
  }
  if (model === 'deepseek-r1:7b') {
    numPredict = 4096;
    numCtx = 8192;
    numGpu = 20;
  }
  if (model === 'qwen2.5') {
    numPredict = 4096;
    numCtx = 8192;
    numGpu = 20;
  }

  const options = {
    temperature: 0.7,
    top_p: 0.9,
    repeat_penalty: 1.1,
    num_predict: numPredict,
    num_ctx: numCtx
  };
  if (numGpu !== null) options.num_gpu = numGpu;

  const res = await fetch('http://localhost:11434/api/generate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model,
      system: SYSTEM_RU,
      prompt,
      stream: false,
      options
    })
  });
  const data = await res.json();
  return cleanFromCJK(data.response || '');
}
async function askCurrent(prompt) {
  if (current === 'DeepSeek') {
    if (!deepseekText) deepseekText = await pyLoadDeepseek();
    const full = ASSISTANTS[current].prompt + '\n\n=== ПРАВИЛА ===\n' + (deepseekText || '') + '\n=== КОНЕЦ ===\n\n' + prompt;
    return askOllama(full, ASSISTANTS[current].model);
  }
  if (!knowledgeText) knowledgeText = await pyLoadKnowledge();
  const full = ASSISTANTS[current].prompt + '\n\n=== БАЗА ЗНАНИЙ ===\n' + (knowledgeText || '(пусто)') + '\n=== КОНЕЦ ===\n\n';
  return askOllama(full + prompt, ASSISTANTS[current].model);
}
function toggleAttachMenu(e) {
  e.stopPropagation();
  document.getElementById('attachMenu').classList.toggle('open');
}
function pickFile(inputId) {
  document.getElementById('attachMenu').classList.remove('open');
  document.getElementById(inputId).click();
}
document.addEventListener('click', (e) => {
  const menu = document.getElementById('attachMenu');
  const btn = document.getElementById('attachBtn');
  if (!menu || !btn) return;
  if (!menu.contains(e.target) && !btn.contains(e.target)) menu.classList.remove('open');
});
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
function resizeImage(base64, maxSize) {
  maxSize = maxSize || 800;
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.src = base64;
  });
}
async function handleImage(event) {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  const c = getActiveChat();
  const raw = await fileToBase64(file);
  const base64 = await resizeImage(raw, 800);
  c.messages.push({ role: 'user', text: '🖼 ' + file.name, image: base64 });
  const div = appendMsg('user', '🖼 ' + file.name);
  const img = document.createElement('img');
  img.className = 'chat-img';
  img.src = base64;
  img.onclick = () => showLightbox(base64);
  div.appendChild(img);
  pendingImage = { name: file.name, base64 };
  c.messages.push({ role: 'ai', text: 'Картинка добавлена. Напиши, что с ней сделать.', assistant: current });
  appendMsg('ai', 'Картинка добавлена. Напиши, что с ней сделать.', current);
  saveChats();
}
async function handleMusic(event) {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  const c = getActiveChat();
  const src = URL.createObjectURL(file);
  c.messages.push({ role: 'user', text: '🎵 ' + file.name });
  appendMsg('user', '🎵 ' + file.name);
  openPlayer(file.name, src);
  const stub = appendMsg('ai', '...', current);
  try {
    const reply = await askCurrent('Пользователь включил музыкальный трек: "' + file.name + '". Напиши 1-2 предложения, по-русски.');
    stub.querySelector('span:last-child').textContent = reply;
    c.messages.push({ role: 'ai', text: reply, assistant: current });
  } catch (e) { stub.querySelector('span:last-child').textContent = 'Ошибка: ' + e.message; }
  saveChats();
}
async function extractDocx(file) {
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const xml = await zip.file('word/document.xml').async('string');
  return xml.replace(/<\/w:p>/g,'\n').replace(/<w:tab[^>]*\/>/g,'\t').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\n{3,}/g,'\n\n').trim();
}
async function extractPdf(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js не загружен');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text.trim();
}
function extractXlsx(file) {
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const wb = XLSX.read(rd.result, { type: 'array' });
        let out = '';
        wb.SheetNames.forEach(name => {
          out += '--- Лист: ' + name + ' ---\n' + XLSX.utils.sheet_to_csv(wb.Sheets[name]) + '\n\n';
        });
        resolve(out.trim());
      } catch (e) { reject(e); }
    };
    rd.readAsArrayBuffer(file);
  });
}
async function handleDoc(event) {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  const c = getActiveChat();
  c.messages.push({ role: 'user', text: '📄 ' + file.name });
  appendMsg('user', '📄 ' + file.name);
  const stub = appendMsg('ai', 'Читаю документ...', current);
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let text = '';
    if (ext === 'docx') text = await extractDocx(file);
    else if (ext === 'pdf') text = await extractPdf(file);
    else if (ext === 'xlsx' || ext === 'xls') text = await extractXlsx(file);
    else text = await file.text();
    text = text.slice(0, 20000);
    const reply = await askCurrent('Пользователь прислал файл "' + file.name + '". Содержимое:\n' + text + '\n\nПрокомментируй кратко, по-русски.');
    stub.querySelector('span:last-child').textContent = reply;
    c.messages.push({ role: 'ai', text: reply, assistant: current });
  } catch (e) { stub.querySelector('span:last-child').textContent = 'Ошибка: ' + e.message; }
  saveChats();
}

async function send() {
  const text = messageEl.value.trim();
  if (!text && !pendingImage) return;
  const c = getActiveChat();
  let userText = text;
  if (pendingImage) {
    userText = (text ? text + '\n' : '') + '[Картинка: ' + pendingImage.name + ']';
  }
  c.messages.push({ role: 'user', text: userText, image: pendingImage ? pendingImage.base64 : null });
  const div = appendMsg('user', userText);
  if (pendingImage) {
    const img = document.createElement('img');
    img.className = 'chat-img';
    img.src = pendingImage.base64;
    img.onclick = () => showLightbox(pendingImage.base64);
    div.appendChild(img);
  }
  messageEl.value = '';
  pendingImage = null;
  if (c.title === 'Новый чат' && userText) {
    c.title = userText.slice(0, 40);
    renderChatList();
  }
  sendBtn.disabled = true;
  const stub = appendMsg('ai', '...', current);
  try {
    const reply = await askCurrent(userText);
    stub.querySelector('span:last-child').textContent = reply;
    c.messages.push({ role: 'ai', text: reply, assistant: current });
  } catch (e) {
    stub.querySelector('span:last-child').textContent = 'Ошибка: ' + e.message;
  }
  sendBtn.disabled = false;
  saveChats();
}

messageEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ========== АВТООБНОВЛЕНИЕ ==========
function compareVer(a, b) {
  const pa = String(a).split('.').map(n => parseInt(n) || 0);
  const pb = String(b).split('.').map(n => parseInt(n) || 0);
  const len = Math.max(pa.length, pb.length);
  for (let i = 0; i < len; i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}

async function checkForUpdates() {
  try {
    const res = await fetch(GITHUB_RAW + '/version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const remote = await res.json();
    const remoteVer = remote.version || '0';
    if (compareVer(remoteVer, VERSION) > 0) {
      showUpdateBanner(remoteVer, remote.notes || '');
    }
  } catch (e) {
    console.warn('checkForUpdates:', e);
  }
}

function showUpdateBanner(version, notes) {
  if (document.getElementById('updateBanner')) return;

  const b = document.createElement('div');
  b.id = 'updateBanner';
  b.innerHTML =
    '<div style="font-weight:bold; color:#fff; margin-bottom:4px; font-size:15px;">🎉 Доступно обновление до v' + version + '</div>' +
    (notes ? '<div style="font-size:12px; color:#bbb; margin-bottom:12px; line-height:1.4;">' + notes + '</div>' : '') +
    '<div style="display:flex; gap:8px;">' +
    '<button id="updateBtn" style="flex:1; background:#D4AF37; color:#000; border:none; border-radius:6px; padding:9px 16px; font-weight:bold; cursor:pointer; font-family:inherit;">Обновить</button>' +
    '<button id="updateLaterBtn" style="flex:1; background:#222; color:#ccc; border:none; border-radius:6px; padding:9px 16px; cursor:pointer; font-family:inherit;">Позже</button>' +
    '</div>';

  Object.assign(b.style, {
    position: 'fixed',
    top: '20px',
    right: '20px',
    background: 'linear-gradient(180deg, #1a1a0a, #0a0a0a)',
    border: '2px solid #D4AF37',
    borderRadius: '12px',
    padding: '16px 20px',
    color: '#D4AF37',
    zIndex: '10000',
    boxShadow: '0 0 40px rgba(212,175,55,0.7)',
    fontFamily: "'Segoe UI', sans-serif",
    maxWidth: '340px',
    animation: 'slideInRight 0.5s ease'
  });

  document.body.appendChild(b);

  document.getElementById('updateBtn').onclick = () => applyUpdate(version);
  document.getElementById('updateLaterBtn').onclick = () => b.remove();
}

async function applyUpdate(version) {
  const btn = document.getElementById('updateBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Загрузка...'; }

  try {
    const res = await fetch(GITHUB_RAW + '/phantom.html?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const newHtml = await res.text();

    if (window.pywebview && window.pywebview.api && window.pywebview.api.save_html) {
      const ok = await window.pywebview.api.save_html(newHtml);
      if (ok) {
        if (btn) btn.textContent = 'Перезапуск...';
        showToast('✅ Обновление установлено. Перезапуск...');
        setTimeout(() => location.reload(), 1500);
        return;
      }
    }

    // Fallback — сохраняем в localStorage
    localStorage.setItem('phantom_pending_update', newHtml);
    showToast('✅ Обновление загружено. Перезапустите студию.');
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Обновить'; }
    showToast('❌ Ошибка загрузки: ' + e.message);
  }
}

function showToast(text) {
  const t = document.createElement('div');
  t.textContent = text;
  Object.assign(t.style, {
    position: 'fixed',
    bottom: '30px',
    left: '50%',
    transform: 'translateX(-50%)',
    background: 'linear-gradient(180deg, #1a1a0a, #0a0a0a)',
    border: '2px solid #D4AF37',
    borderRadius: '10px',
    padding: '14px 24px',
    color: '#D4AF37',
    fontFamily: "'Segoe UI', sans-serif",
    fontSize: '14px',
    zIndex: '10001',
    boxShadow: '0 0 30px rgba(212,175,55,0.6)',
    animation: 'slideInUp 0.4s ease'
  });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// Стили анимации
const styleEl = document.createElement('style');
styleEl.textContent =
  '@keyframes slideInRight { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }' +
  '@keyframes slideInUp { from { transform: translateX(-50%) translateY(100px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }';
document.head.appendChild(styleEl);

// Проверка обновления через 4 секунды после загрузки
setTimeout(checkForUpdates, 4000);
