<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Phantom — Phantom Road Studio</title>
<link rel="icon" href="phantom-icon.ico" type="image/x-icon">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; display: flex; }
  .intro { position: fixed; inset: 0; background: #050505; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; z-index: 9999; animation: fadeOut 1s ease 4s forwards; }
  .qwen-logo { width: 140px; opacity: 0; animation: logoIn 1.5s ease 0.3s forwards; }
  .intro h1 { font-size: 70px; letter-spacing: 20px; color: #000; -webkit-text-stroke: 2px #D4AF37; text-shadow: 0 0 30px #D4AF37, 0 0 60px #D4AF37; opacity: 0; animation: glowIn 1.5s ease 1s forwards; }
  .copyright { font-size: 14px; color: #888; letter-spacing: 2px; opacity: 0; animation: glowIn 1.5s ease 2s forwards; }
  @keyframes logoIn { 0%{opacity:0;transform:scale(.5) rotate(-10deg);filter:blur(10px);} 100%{opacity:1;transform:scale(1) rotate(0);filter:blur(0);} }
  @keyframes glowIn { 0%{opacity:0;transform:scale(.8);} 100%{opacity:1;transform:scale(1);} }
  @keyframes fadeOut { 0%{opacity:1;} 100%{opacity:0;visibility:hidden;} }
  .sidebar { width: 260px; background: #0a0a0a; border-right: 1px solid #D4AF37; display: flex; flex-direction: column; padding: 20px 12px; gap: 12px; z-index: 30; }
  .assistant-tabs { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .assistant-tabs button { background: #111; border: 1px solid #333; color: #888; border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; transition: .2s; font-family: inherit; text-align: left; }
  .assistant-tabs button:hover { border-color: #D4AF37; color: #D4AF37; }
  .assistant-tabs button.active { background: #D4AF37; color: #000; font-weight: bold; border-color: #D4AF37; }
  .new-chat { background: #D4AF37; border: none; border-radius: 8px; padding: 12px; color: #000; font-weight: bold; cursor: pointer; transition: .3s; }
  .new-chat:hover { background: #ff2a2a; color: #fff; box-shadow: 0 0 15px #ff2a2a; }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .chat-item { padding: 10px 12px; border-radius: 6px; background: #111; color: #ccc; cursor: pointer; font-size: 14px; transition: .2s; border: 1px solid transparent; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chat-item:hover { background: #1a1a1a; border-color: #D4AF37; }
  .chat-item.active { background: #1a1a1a; border-color: #D4AF37; color: #D4AF37; }
  .chat-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .delete-chat { color: #555; cursor: pointer; transition: .2s; flex-shrink: 0; }
  .delete-chat:hover { color: #ff2a2a; text-shadow: 0 0 10px #ff2a2a; }
  .main { flex: 1; position: relative; display: flex; flex-direction: column; }
  .frame { position: fixed; inset: 15px; border: 2px solid #D4AF37; border-radius: 12px; pointer-events: none; box-shadow: 0 0 20px rgba(212,175,55,.4); z-index: 10; }
  .title { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); font-size: 24px; letter-spacing: 8px; color: #D4AF37; text-transform: uppercase; z-index: 5; text-shadow: 0 0 10px rgba(212,175,55,.6); }
  .eyes { position: fixed; top: 22%; left: 50%; transform: translate(-50%,-50%); display: flex; gap: 80px; z-index: 0; pointer-events: none; opacity: 0.35; }
  .eye { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #ff2a2a 0%, #8b0000 50%, #000 100%); box-shadow: 0 0 40px #ff2a2a; position: relative; animation: blink 5s infinite; }
  .pupil { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 6px; height: 26px; background: #000; border-radius: 50%; }
  @keyframes blink { 0%,92%,100%{transform:scaleY(1);} 95%{transform:scaleY(.1);} }
  .chat-log { flex: 1; margin: 90px 20px 130px 20px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 15; position: relative; transition: margin-bottom .2s; }
  .chat-log.player-open { margin-bottom: 210px; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 10px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: rgba(30,58,95,0.85); border: 1px solid rgba(212,175,55,0.4); }
  .msg.ai { align-self: flex-start; background: rgba(15,15,15,0.9); border: 1px solid #D4AF37; color: #eee; }
  .msg.system { align-self: center; background: rgba(212,175,55,0.15); border: 1px solid #D4AF37; color: #D4AF37; font-size: 13px; max-width: 90%; text-align: center; }
  .msg .label { display: block; font-size: 11px; color: #D4AF37; letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
  .msg img.chat-img { max-width: 320px; max-height: 320px; border-radius: 8px; margin-top: 6px; display: block; cursor: pointer; }

  .player-box { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 700px; background: rgba(10,10,10,0.95); border: 1px solid #D4AF37; border-radius: 10px; padding: 10px 14px; z-index: 20; display: none; box-shadow: 0 0 20px rgba(212,175,55,.4); }
  .player-box.visible { display: block; }
  .player-box .row1 { display: flex; align-items: center; gap: 10px; }
  .player-box .track-name { flex: 1; color: #D4AF37; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-box .close-btn { background: transparent; border: 1px solid #D4AF37; color: #D4AF37; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .player-box .close-btn:hover { background: #ff2a2a; color: #fff; border-color: #ff2a2a; }
  .player-box audio { width: 100%; outline: none; margin-top: 8px; }
  .chat-bar { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 700px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
  .input-row { display: flex; gap: 10px; align-items: center; }
  .attach-wrapper { position: relative; flex-shrink: 0; }
  .attach-btn { background: #111; border: 2px solid #D4AF37; border-radius: 8px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .3s; }
  .attach-btn img { width: 32px; height: 32px; object-fit: contain; }
  .attach-btn:hover { box-shadow: 0 0 20px #D4AF37; background: #1a1a1a; }
  .attach-menu { position: absolute; bottom: 60px; left: 0; background: #0a0a0a; border: 1px solid #D4AF37; border-radius: 8px; padding: 8px; display: none; flex-direction: column; gap: 6px; min-width: 250px; box-shadow: 0 0 20px rgba(212,175,55,.4); }
  .attach-menu.open { display: flex; }
  .attach-menu button { background: transparent; border: none; color: #D4AF37; padding: 10px 14px; text-align: left; cursor: pointer; border-radius: 4px; font-family: inherit; font-size: 14px; }
  .attach-menu button:hover { background: #1a1a1a; color: #fff; }
  input[type="text"] { flex: 1; background: rgba(20,20,20,0.9); border: 1px solid #D4AF37; border-radius: 8px; padding: 14px 18px; color: #fff; font-size: 16px; outline: none; }
  input[type="text"]:focus { box-shadow: 0 0 15px rgba(212,175,55,.6); }
  .send-btn { background: #D4AF37; border: none; border-radius: 8px; padding: 0 24px; height: 48px; color: #000; font-weight: bold; cursor: pointer; transition: .3s; }
  .send-btn:hover { background: #ff2a2a; color: #fff; box-shadow: 0 0 20px #ff2a2a; }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; }
  .footer { position: fixed; bottom: 22px; right: 32px; font-size: 12px; color: #666; letter-spacing: 1px; z-index: 100; }

  .img-lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9998; display: none; align-items: center; justify-content: center; flex-direction: column; cursor: zoom-out; }
  .img-lightbox.visible { display: flex; }
  .img-lightbox img { max-width: 92%; max-height: 85%; border: 2px solid #D4AF37; border-radius: 12px; }
  .img-lightbox .download-btn { margin-top: 16px; background: #D4AF37; color: #000; border: none; padding: 10px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; font-family: inherit; transition: .3s; }
  .img-lightbox .download-btn:hover { background: #ff2a2a; color: #fff; box-shadow: 0 0 20px #ff2a2a; }

  .update-toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-200%); background: linear-gradient(180deg, #1a1a0a, #0a0a0a); border: 2px solid #D4AF37; border-radius: 12px; padding: 16px 28px; color: #D4AF37; font-size: 15px; z-index: 10000; box-shadow: 0 0 40px rgba(212,175,55,.7); transition: transform .5s ease, opacity .5s; opacity: 0; max-width: 600px; text-align: center; pointer-events: none; }
  .update-toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
  .update-toast .ttl { font-weight: bold; font-size: 17px; margin-bottom: 6px; color: #fff; }
  .update-toast .notes { font-size: 13px; color: #ccc; }

  .img-queue { display: flex; flex-wrap: wrap; gap: 6px; }
  .img-queue:not(:empty) { padding: 6px 0; }
  .img-queue .chip { position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 1px solid #D4AF37; }
  .img-queue .chip img { width: 100%; height: 100%; object-fit: cover; }
  .img-queue .chip .rm { position: absolute; top: 2px; right: 2px; background: rgba(200,0,0,0.85); color: #fff; border: none; width: 18px; height: 18px; border-radius: 50%; cursor: pointer; font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center; }
</style>
<!-- LIB_PLACEHOLDER -->
</head>
<body>

  <div class="intro">
    <img src="qwen-logo.png" class="qwen-logo" alt="Qwen">
    <h1>PHANTOM</h1>
    <p class="copyright">© 2026 Phantom Road Studio. Все права защищены.</p>
  </div>

  <div class="sidebar">
    <div class="assistant-tabs" id="assistantTabs">
      <button data-a="Qwen" onclick="switchAssistant('Qwen')">● Qwen</button>
      <button data-a="Claude" onclick="switchAssistant('Claude')">○ Claude</button>
      <button data-a="Alice" onclick="switchAssistant('Alice')">○ Alice</button>
    </div>
    <button class="new-chat" onclick="newChat()">+ Новый чат</button>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="main">
    <div class="frame"></div>
    <div class="title">PHANTOM ROAD STUDIO</div>
    <div class="eyes">
      <div class="eye"><div class="pupil"></div></div>
      <div class="eye"><div class="pupil"></div></div>
    </div>
    <div class="chat-log" id="chatLog"></div>

    <div class="player-box" id="playerBox">
      <div class="row1">
        <div class="track-name" id="trackName">—</div>
        <button class="close-btn" onclick="closePlayer()" title="Закрыть плеер">✕</button>
      </div>
      <audio id="player" controls></audio>
    </div>

    <div class="chat-bar">
      <div class="img-queue" id="imgQueue"></div>
      <div class="input-row">
        <div class="attach-wrapper">
          <button class="attach-btn" id="attachBtn" onclick="toggleAttachMenu(event)"><img src="qwen-logo.png" alt="+"></button>
          <div class="attach-menu" id="attachMenu">
            <button onclick="pickFile('imageInput')">🖼 Картинки (можно несколько)</button>
            <button onclick="pickFile('musicInput')">🎵 Музыка</button>
            <button onclick="pickFile('docInput')">📄 Документ</button>
            <button onclick="pickMergeFiles()">🧩 Склеить картинки в ряд</button>
          </div>
        </div>
        <input type="file" id="imageInput" accept="image/*" multiple style="display:none" onchange="handleImage(event)">
        <input type="file" id="musicInput" accept="audio/*" style="display:none" onchange="handleMusic(event)">
        <input type="file" id="docInput" accept=".txt,.md,.json,.js,.html,.css,.py,.pdf,.docx,.doc,.xlsx,.xls,.csv" style="display:none" onchange="handleDoc(event)">
        <input type="file" id="mergeInput" accept="image/*" multiple style="display:none" onchange="mergeFromPicker(event)">
        <input type="text" id="message" placeholder="Введите сообщение..." autofocus>
        <button class="send-btn" id="sendBtn" onclick="send()">Отправить</button>
      </div>
    </div>

    <div class="footer">© 2026 Phantom Road Studio</div>
  </div>

  <div class="img-lightbox" id="imgLightbox">
    <img id="imgLightboxImg" src="" onclick="event.stopPropagation();">
    <button class="download-btn" onclick="downloadCurrentImage()">⬇ Скачать</button>
  </div>

  <div class="update-toast" id="updateToast">
    <div class="ttl">✅ Phantom Road Studio обновлён</div>
    <div class="notes" id="updateToastNotes"></div>
  </div>

<script>
  const VERSION = '1.5';
  const ASSISTANTS = {
    Qwen:   { model: 'qwen2.5', prompt: 'Ты — Квен, инженер-оптимизатор Phantom Road Studio. Помогаешь с кодом, системой, настройкой. Отвечай кратко и по делу.' },
    Claude: { model: 'mistral', prompt: 'Ты — Клод, вдумчивый аналитик Phantom Road Studio. Отвечай точно и по делу. Пиши грамотно, без опечаток.' },
    Alice:  { model: 'qwen2.5', prompt: 'Ты — Алиса, дружелюбная помощница Phantom Road Studio. Отвечай тепло, но по существу.' }
  };
  const SYSTEM_RU = 'Ты общаешься ТОЛЬКО на русском языке. Категорически запрещено использовать китайские, японские, корейские иероглифы и любые слова не на русском. Только русский.';

  let current = 'Qwen';
  let chats = [];
  let currentChatId = null;
  let knowledgeText = '';
  let pendingImages = [];

  const chatLog = document.getElementById('chatLog');
  const messageEl = document.getElementById('message');
  const sendBtn = document.getElementById('sendBtn');
  const playerBox = document.getElementById('playerBox');
  const player = document.getElementById('player');
  const trackName = document.getElementById('trackName');
  const imgQueue = document.getElementById('imgQueue');

  function cleanFromCJK(text) {
    if (!text) return text;
    return text
      .replace(/[\u4e00-\u9fff\u3400-\u4dbf\u3040-\u30ff\uac00-\ud7af\uff00-\uffef]+/g, '')
      .replace(/[ \t]{2,}/g, ' ')
      .trim();
  }

  async function pyLoadChats(assistant) {
    try {
      if (window.pywebview && window.pywebview.api) {
        const raw = await window.pywebview.api.load_chats(assistant);
        return JSON.parse(raw);
      }
    } catch (e) { console.warn('pyLoadChats', e); }
    try { return JSON.parse(localStorage.getItem('phantom_chats_' + assistant.toLowerCase())) || []; }
    catch (e) { return []; }
  }
  async function pySaveChats(assistant, data) {
    try {
      if (window.pywebview && window.pywebview.api) {
        await window.pywebview.api.save_chats(assistant, JSON.stringify(data));
        return;
      }
    } catch (e) { console.warn('pySaveChats', e); }
    localStorage.setItem('phantom_chats_' + assistant.toLowerCase(), JSON.stringify(data));
  }
  async function pyLoadKnowledge() {
    try {
      if (window.pywebview && window.pywebview.api) return await window.pywebview.api.load_knowledge();
    } catch (e) {}
    return localStorage.getItem('phantom_knowledge') || '';
  }

  async function loadChats() {
    chats = await pyLoadChats(current);
    if (!chats.length) { newChat(); }
    else { currentChatId = chats[0].id; renderChatList(); renderChatLog(); }
  }
  async function saveChats() { await pySaveChats(current, chats); }

  function newChat() {
    stopPlayer(); pendingImages = []; renderImgQueue();
    const chat = { id: Date.now(), title: 'Новый чат', messages: [] };
    chats.unshift(chat); currentChatId = chat.id;
    saveChats(); renderChatList(); renderChatLog();
  }
  function selectChat(id) {
    stopPlayer(); pendingImages = []; renderImgQueue();
    currentChatId = id; renderChatList(); renderChatLog();
  }
  function deleteChat(id, e) {
    e.stopPropagation();
    chats = chats.filter(c => c.id !== id);
    if (currentChatId === id) { if (chats.length) currentChatId = chats[0].id; else return newChat(); }
    saveChats(); renderChatList(); renderChatLog();
  }
  function getActiveChat() { return chats.find(c => c.id === currentChatId); }

  function switchAssistant(name) {
    current = name; stopPlayer(); pendingImages = []; renderImgQueue();
    document.querySelectorAll('#assistantTabs button').forEach(b => {
      const a = b.dataset.a;
      b.classList.toggle('active', a === name);
      b.textContent = (a === name ? '● ' : '○ ') + a;
    });
    loadChats();
  }

  function openPlayer(name, src) {
    player.src = src;
    trackName.textContent = '🎵 ' + name;
    playerBox.classList.add('visible');
    chatLog.classList.add('player-open');
    player.play().catch(() => {});
  }
  function closePlayer() { stopPlayer(); }
  function stopPlayer() {
    if (player) { player.pause(); player.src = ''; }
    if (playerBox) playerBox.classList.remove('visible');
    if (chatLog) chatLog.classList.remove('player-open');
  }

  function renderChatList() {
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    chats.forEach(c => {
      const div = document.createElement('div');
      div.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
      div.onclick = () => selectChat(c.id);
      div.innerHTML = `<span class="chat-title">${escapeHtml(c.title)}</span><span class="delete-chat">✕</span>`;
      div.querySelector('.delete-chat').onclick = (e) => deleteChat(c.id, e);
      list.appendChild(div);
    });
  }
  function renderChatLog() {
    chatLog.innerHTML = '';
    const c = getActiveChat();
    if (!c) return;
    c.messages.forEach(m => {
      const div = appendMsg(m.role, m.text, m.assistant, m.system);
      if (m.image) {
        const img = document.createElement('img');
        img.className = 'chat-img';
        img.src = m.image;
        img.onclick = (e) => { e.stopPropagation(); showLightbox(m.image); };
        div.appendChild(img);
      }
    });
    chatLog.scrollTop = chatLog.scrollHeight;
  }
  function appendMsg(role, text, assistant, isSystem) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isSystem ? 'system' : role === 'user' ? 'user' : 'ai');
    if (role === 'ai' && assistant && !isSystem) {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = assistant;
      div.appendChild(label);
    }
    const span = document.createElement('span');
    span.textContent = text;
    div.appendChild(span);
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
    return div;
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function renderImgQueue() {
    imgQueue.innerHTML = '';
    pendingImages.forEach((item, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = `<img src="${item.base64}"><button class="rm" title="Убрать">✕</button>`;
      chip.querySelector('.rm').onclick = () => { pendingImages.splice(i, 1); renderImgQueue(); };
      imgQueue.appendChild(chip);
    });
  }

  let currentLightboxSrc = null;
  function showLightbox(src) {
    currentLightboxSrc = src;
    document.getElementById('imgLightboxImg').src = src;
    document.getElementById('imgLightbox').classList.add('visible');
  }
  function closeLightbox() {
    document.getElementById('imgLightbox').classList.remove('visible');
    currentLightboxSrc = null;
  }
  document.getElementById('imgLightbox').addEventListener('click', (e) => {
    if (e.target.id === 'imgLightbox') closeLightbox();
  });
  function downloadCurrentImage() {
    if (!currentLightboxSrc) return;
    const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
    const a = document.createElement('a');
    a.href = currentLightboxSrc;
    a.download = 'phantom-image-' + ts + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  async function askOllama(prompt, model, history) {
    let fullPrompt = '';
    if (history && history.length) {
      for (const m of history) {
        fullPrompt += (m.role === 'user' ? 'Пользователь: ' : 'Ассистент: ') + m.content + '\n';
      }
    }
    fullPrompt += 'Пользователь: ' + prompt + '\nАссистент:';

    const res = await fetch('http://localhost:11434/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, system: SYSTEM_RU, prompt: fullPrompt, stream: false })
    });
    const data = await res.json();
    return cleanFromCJK(data.response || '');
  }
  async function askCurrent(prompt) {
    if (!knowledgeText) knowledgeText = await pyLoadKnowledge();
    const systemPrefix = ASSISTANTS[current].prompt +
      '\n\n=== БАЗА ЗНАНИЙ КОМАНДЫ ===\n' + (knowledgeText || '(пусто)') +
      '\n=== КОНЕЦ БАЗЫ ===\n\n';
    const c = getActiveChat();
    const history = [];
    if (c) {
      const msgs = c.messages.slice(-13, -1);
      for (const m of msgs) {
        if (m.role === 'user') history.push({ role: 'user', content: m.text });
        else if (m.role === 'ai') history.push({ role: 'assistant', content: m.text });
      }
    }
    return askOllama(systemPrefix + prompt, ASSISTANTS[current].model, history);
  }

  function toggleAttachMenu(e) {
    e.stopPropagation();
    document.getElementById('attachMenu').classList.toggle('open');
  }
  function pickFile(inputId) {
    document.getElementById('attachMenu').classList.remove('open');
    document.getElementById(inputId).click();
  }
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('attachMenu');
    const btn = document.getElementById('attachBtn');
    if (!menu || !btn) return;
    if (!menu.contains(e.target) && !btn.contains(e.target)) menu.classList.remove('open');
  });

  function resizeImage(base64, maxSize = 800) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = base64;
    });
  }

  async function handleImage(event) {
    const files = Array.from(event.target.files || []);
    event.target.value = '';
    if (!files.length) return;
    for (const file of files) {
      const raw = await new Promise(r => {
        const rd = new FileReader();
        rd.onload = () => r(rd.result);
        rd.readAsDataURL(file);
      });
      const base64 = await resizeImage(raw, 800);
      pendingImages.push({ name: file.name, base64 });
    }
    renderImgQueue();
    messageEl.focus();
  }

  // ====== СКЛЕЙКА: выбор файлов + автосклейка ======
  function pickMergeFiles() {
    document.getElementById('attachMenu').classList.remove('open');
    document.getElementById('mergeInput').value = '';
    document.getElementById('mergeInput').click();
  }

  async function mergeFromPicker(event) {
    const files = Array.from(event.target.files || []);
    event.target.value = '';
    if (files.length < 2) {
      const c = getActiveChat();
      const msg = '🧩 Для склейки нужно минимум 2 картинки. Выбрано: ' + files.length;
      if (c) {
        c.messages.push({ role: 'ai', text: msg, assistant: current, system: true });
        appendMsg('ai', msg, current, true);
        saveChats();
      }
      return;
    }
    const c = getActiveChat();
    const stub = appendMsg('ai', '🧩 Склеиваю ' + files.length + ' картинок...', current);
    try {
      const images = [];
      for (const file of files) {
        const raw = await new Promise(r => {
          const rd = new FileReader();
          rd.onload = () => r(rd.result);
          rd.readAsDataURL(file);
        });
        const base64 = await resizeImage(raw, 1200);
        images.push({ name: file.name, base64 });
      }
      const imgs = await Promise.all(images.map(p => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = p.base64;
      })));
      const targetH = Math.max(...imgs.map(i => i.height));
      const scaled = imgs.map(i => {
        const w = Math.round(i.width * targetH / i.height);
        return { img: i, w, h: targetH };
      });
      const GAP = 8;
      const totalW = scaled.reduce((s, x) => s + x.w, 0) + GAP * (scaled.length - 1);
      const canvas = document.createElement('canvas');
      canvas.width = totalW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, totalW, targetH);
      let x = 0;
      for (const s of scaled) {
        ctx.drawImage(s.img, x, 0, s.w, s.h);
        x += s.w + GAP;
      }
      const merged = canvas.toDataURL('image/jpeg', 0.9);

      c.messages.push({ role: 'user', text: '🧩 Склейка ' + files.length + ' картинок в ряд', image: merged });
      const div = document.createElement('div');
      div.className = 'msg user';
      const span = document.createElement('span');
      span.textContent = '🧩 Склейка ' + files.length + ' картинок в ряд';
      div.appendChild(span);
      const img = document.createElement('img');
      img.className = 'chat-img';
      img.src = merged;
      img.onclick = (e) => { e.stopPropagation(); showLightbox(merged); };
      div.appendChild(img);
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;

      stub.querySelector('span:last-child').textContent = '...';
      try {
        const reply = await askCurrent('Пользователь склеил ' + files.length + ' картинок в одну горизонтальную. Прокомментируй кратко по-русски.');
        stub.querySelector('span:last-child').textContent = reply;
        c.messages.push({ role: 'ai', text: reply, assistant: current });
      } catch (e) {
        stub.querySelector('span:last-child').textContent = 'Склеено. (комментарий ИИ: ' + e.message + ')';
      }
      saveChats();
    } catch (e) {
      stub.querySelector('span:last-child').textContent = 'Ошибка склейки: ' + e.message;
    }
  }

  async function handleMusic(event) {
    const file = event.target.files[0]; event.target.value = '';
    if (!file) return;
    const c = getActiveChat();
    const src = URL.createObjectURL(file);
    c.messages.push({ role: 'user', text: '🎵 ' + file.name });
    appendMsg('user', '🎵 ' + file.name);
    openPlayer(file.name, src);
    const stub = appendMsg('ai', '...', current);
    try {
      const reply = await askCurrent('Пользователь включил музыкальный трек: "' + file.name + '". Напиши 1-2 предложения, по-русски.');
      stub.querySelector('span:last-child').textContent = reply;
      c.messages.push({ role: 'ai', text: reply, assistant: current });
    } catch (e) {
      stub.querySelector('span:last-child').textContent = 'Ошибка: ' + e.message;
    }
    saveChats();
  }

  async function extractDocx(file) {
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const xml = await zip.file('word/document.xml').async('string');
    return xml.replace(/<\/w:p>/g,'\n').replace(/<w:tab[^>]*\/>/g,'\t').replace(/<[^>]+>/g,'')
      .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\n{3,}/g,'\n\n').trim();
  }
  async function extractPdf(file) {
    if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js не загружен');
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    return text.trim();
  }
  function extractXlsx(file) {
    return new Promise((resolve, reject) => {
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const wb = XLSX.read(rd.result, { type: 'array' });
          let out = '';
          wb.SheetNames.forEach(name => {
            out += '--- Лист: ' + name + ' ---\n';
            out += XLSX.utils.sheet_to_csv(wb.Sheets[name]) + '\n\n';
          });
          resolve(out.trim());
        } catch (e) { reject(e); }
      };
      rd.readAsArrayBuffer(file);
    });
  }
  async function handleDoc(event) {
    const file = event.target.files[0]; event.target.value = '';
    if (!file) return;
    const c = getActiveChat();
    c.messages.push({ role: 'user', text: '📄 ' + file.name });
    appendMsg('user', '📄 ' + file.name);
    const stub = appendMsg('ai', 'Читаю документ...', current);
    try {
      const ext = file.name.split('.').pop().toLowerCase();
      let text = '';
      if (ext === 'docx') text = await extractDocx(file);
      else if (ext === 'pdf') text = await extractPdf(file);
      else if (ext === 'xlsx' || ext === 'xls') text = await extractXlsx(file);
      else text = await file.text();
      text = text.slice(0, 20000);
      const reply = await askCurrent('Пользователь прислал файл "' + file.name + '". Содержимое:\n' + text + '\n\nПрокомментируй кратко, по-русски.');
      stub.querySelector('span:last-child').textContent = reply;
      c.messages.push({ role: 'ai', text: reply, assistant: current });
    } catch (e) {
      stub.querySelector('span:last-child').textContent = 'Ошибка: ' + e.message;
    }
    saveChats();
  }

  async function send() {
    const text = messageEl.value.trim();
    if (!text && !pendingImages.length) return;
    const c = getActiveChat();

    const imagesToSend = pendingImages.slice();
    const userText = text;

    if (userText) {
      c.messages.push({ role: 'user', text: userText });
      appendMsg('user', userText);
    }

    if (imagesToSend.length) {
      const lastMsg = c.messages[c.messages.length - 1];
      if (!lastMsg || lastMsg.role !== 'user') {
        c.messages.push({ role: 'user', text: '🖼 ' + imagesToSend.length + ' картинок' });
        appendMsg('user', '🖼 ' + imagesToSend.length + ' картинок');
      }
      const div = chatLog.querySelector('.msg.user:last-child');
      for (const im of imagesToSend) {
        const c2 = c.messages[c.messages.length - 1];
        if (!c2.images) c2.images = [];
        c2.images.push(im.base64);
        if (div) {
          const img = document.createElement('img');
          img.className = 'chat-img';
          img.src = im.base64;
          img.onclick = (e) => { e.stopPropagation(); showLightbox(im.base64); };
          div.appendChild(img);
        }
      }
      c.messages[c.messages.length - 1].image = imagesToSend[0].base64;
    }

    if (c.messages.length === 1) c.title = (userText || '🖼 Картинки').slice(0, 30);

    messageEl.value = '';
    pendingImages = []; renderImgQueue();
    sendBtn.disabled = true;
    const stub = appendMsg('ai', '...', current);

    try {
      let reply;
      if (imagesToSend.length) {
        stub.querySelector('span:last-child').textContent = 'Смотрю на картинки...';
        const descriptions = [];
        for (let i = 0; i < imagesToSend.length; i++) {
          const llavaRes = await fetch('http://localhost:11434/api/generate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'llava',
              prompt: 'Describe this image in detail in English.',
              images: [imagesToSend[i].base64.split(',')[1]],
              stream: false
            })
          });
          const llavaData = await llavaRes.json();
          descriptions.push('Картинка ' + (i + 1) + ': ' + (llavaData.response || ''));
        }
        stub.querySelector('span:last-child').textContent = 'Формулирую...';
        const finalPrompt = 'Пользователь прислал изображения. Описания:\n' + descriptions.join('\n') +
          '\n\nВопрос пользователя: ' + (userText || 'Опиши эти картинки.');
        reply = await askCurrent(finalPrompt);
      } else {
        reply = await askCurrent(userText);
      }
      stub.querySelector('span:last-child').textContent = reply;
      c.messages.push({ role: 'ai', text: reply, assistant: current });
    } catch (e) {
      stub.querySelector('span:last-child').textContent = 'Ошибка: ' + e.message;
    }

    sendBtn.disabled = false;
    await saveChats();
    renderChatList();
  }

  messageEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  function showUpdateToast(version, notes) {
    const toast = document.getElementById('updateToast');
    if (!toast) return;
    toast.querySelector('.ttl').textContent = '✅ Phantom Road Studio обновлён до версии ' + version;
    document.getElementById('updateToastNotes').textContent = notes || '';
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 5000);
  }

  async function checkUpdateAndNotify() {
    if (!window.pywebview || !window.pywebview.api || !window.pywebview.api.check_update) return;
    try {
      const r = await window.pywebview.api.check_update();
      if (r && r.status === 'updated') showUpdateToast(r.version, r.notes);
    } catch (e) { console.warn('checkUpdate', e); }
  }

  async function boot() {
    if (window.__booted) return;
    window.__booted = true;
    knowledgeText = await pyLoadKnowledge();
    switchAssistant('Qwen');
    setTimeout(checkUpdateAndNotify, 1500);
  }
  if (window.pywebview && window.pywebview.api) {
    boot();
  } else {
    window.addEventListener('pywebviewready', boot);
    setTimeout(() => { if (!window.__booted) boot(); }, 800);
  }
</script>
