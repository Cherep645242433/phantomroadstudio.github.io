<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Road Studio — Phantom OS</title>
    <style>
        /* ---------- Анимированный фон: звёзды ---------- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
            background-color: #000000;
            overflow-x: hidden;
            position: relative;
            animation: fadeIn 0.8s ease-out;
        }
        /* Звёздный фон */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background-color: #D4AF37;
            border-radius: 50%;
            opacity: 0;
            animation: starGlow 4s infinite ease-in-out;
        }
        @keyframes starGlow {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.5); }
        }
        /* Контент поверх фона */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        /* Анимация появления блоков */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeIn 0.6s ease-out;
        }
        .shield {
            font-size: 80px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; text-shadow: 0 0 0px #D4AF37; }
            50% { transform: scale(1.08); opacity: 1; text-shadow: 0 0 15px #D4AF37; }
            100% { transform: scale(1); opacity: 0.9; text-shadow: 0 0 0px #D4AF37; }
        }
        h1 {
            color: #D4AF37;
            font-size: 2.8em;
            margin: 10px 0;
        }
        .sub {
            font-size: 1.2em;
            color: #D4AF37;
            margin-bottom: 30px;
        }
        .section {
            background-color: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 4px solid #D4AF37;
            transition: all 0.3s ease;
            animation: fadeIn 0.7s ease-out;
        }
        .section:hover {
            background-color: rgba(26, 26, 26, 0.9);
            transform: translateX(5px);
        }
        .section h2 {
            color: #D4AF37;
            margin-top: 0;
            font-size: 1.8em;
        }
        .section h3 {
            color: #D4AF37;
            margin: 20px 0 10px;
        }
        .btn {
            display: inline-block;
            background-color: #D4AF37;
            color: #000000;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            margin: 10px 0;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover {
            background-color: #e6c85c;
            transform: scale(1.03);
        }
        .btn-group {
            margin: 20px 0;
        }
        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(51, 51, 51, 0.8);
            font-size: 0.8em;
            color: #aaa;
            animation: fadeIn 1s ease-out;
        }
        a {
            color: #D4AF37;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        ul, ol {
            padding-left: 20px;
        }
        li {
            margin: 8px 0;
        }
        .install-steps {
            background-color: rgba(26, 26, 26, 0.9);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <!-- Анимированный фон со звёздами (JS генерирует) -->
    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="header">
            <div class="shield">🛡️</div>
            <h1>Phantom Road Studio</h1>
            <div class="sub">Независимая студия из Минска</div>
        </div>

        <!-- Здесь весь твой контент (разделы) — он полностью сохранён, просто опущен для краткости, но в реальном коде он будет -->

        <div class="footer">
            © 2026 Phantom Road Studio · Бесплатно. Навсегда.<br>
            Официальный сайт Phantom Road Studio
        </div>
    </div>

    <script>
        // Генерация звёзд на фоне
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 120;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 2.5 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                star.style.animationDuration = Math.random() * 3 + 2 + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();
    </script>
</body>
</html>
