<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Road Studio - Технические работы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            cursor: none;
        }

        /* Кастомный курсор */
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid #ff3333;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            box-shadow: 0 0 10px #ff3333;
            transition: transform 0.1s;
        }

        /* Контейнер с текстом */
        .maintenance-box {
            text-align: center;
            z-index: 10;
            padding: 40px;
            border: 2px solid #ff3333;
            border-radius: 15px;
            background: rgba(10, 10, 10, 0.9);
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.2);
            max-width: 600px;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255, 51, 51, 0.2); }
            100% { box-shadow: 0 0 40px rgba(255, 51, 51, 0.6); }
        }

        h1 {
            color: #ff3333;
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.8);
        }

        h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 400;
        }

        p {
            color: #ccc;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .loader {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 51, 51, 0.3);
            border-top-color: #ff3333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Анимированный фон (простые частицы огня) */
        .fire-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at bottom, rgba(255, 51, 51, 0.15), transparent 60%);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="custom-cursor" id="cursor"></div>
    <div class="fire-bg"></div>

    <div class="maintenance-box">
        <h1>PHANTOM ROAD STUDIO</h1>
        <h2>🛠️ Ведутся плановые работы</h2>
        <p>Мы обновляем наш сайт, чтобы сделать его еще быстрее и красивее. Пожалуйста, зайдите чуть позже!</p>
        <div class="loader"></div>
    </div>

    <script>
        // Курсор
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
