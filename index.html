<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Road Studio</title>
    <style>
        /* Базовые стили для всего сайта */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Стили для стартового экрана */
        #start-screen {
            position: fixed;
            inset: 0;
            background-color: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #start-screen h1 {
            color: #ff3333;
            font-size: 3rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }

        .btn-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-user {
            background: #ff3333;
            color: white;
            border: 2px solid #ff3333;
        }

        .btn-user:hover {
            background: #cc0000;
            border-color: #cc0000;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        }

        .btn-admin {
            background: transparent;
            color: #ff3333;
            border: 2px solid #ff3333;
        }

        .btn-admin:hover {
            background: #ff3333;
            color: white;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        }

        /* Стили для основного контента */
        #main-site {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 50px 0;
            border-bottom: 2px solid #ff3333;
            margin-bottom: 30px;
        }

        h2 {
            color: #ff3333;
        }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН (Выбор роли) -->
    <div id="start-screen">
        <h1>Phantom Road Studio</h1>
        <div class="btn-container">
            <button class="btn btn-user" onclick="login('user')">Войти как игрок</button>
            <button class="btn btn-admin" onclick="login('admin')">Вход для разработчиков</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ САЙТ -->
    <div id="main-site">
        <header>
            <h1>Phantom Road Studio</h1>
            <p>Версия ИИ: <strong>1.6</strong></p>
        </header>

        <!-- ========================================== -->
        <!-- ВСТАВЬ СЮДА ВЕСЬ СВОЙ КОНТЕНТ САЙТА        -->
        <!-- (Новости, описание игры, ссылки на скачивание и т.д.) -->
        <!-- ========================================== -->
        
        <div style="text-align: center; padding: 50px;">
            <h2>Добро пожаловать в Need World Speed!</h2>
            <p>Здесь будет твой дизайн, скриншоты и кнопки скачивания.</p>
        </div>

        <!-- ========================================== -->
    </div>

    <!-- СКРИПТЫ -->
    <script>
        function login(role) {
            if (role === 'user') {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main-site').style.display = 'block';
            } else if (role === 'admin') {
                let pass = prompt("Введите пароль администратора:");
                if (pass === "nws_admin_2026") { // Поменяй пароль на свой!
                    document.getElementById('start-screen').style.display = 'none';
                    document.getElementById('main-site').style.display = 'block';
                    // Можно добавить вывод панели администратора
                    alert("Доступ разрешен. Добро пожаловать, разработчик!");
                } else {
                    alert("Неверный пароль!");
                }
            }
        }
    </script>

</body>
</html>
