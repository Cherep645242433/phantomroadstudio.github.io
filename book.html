<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книги — Phantom Road Studio</title>
<link rel="icon" href="phantom-icon.ico" type="image/x-icon">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; padding-top: 35px; }

  .work-banner {
    position: fixed; top: 0; left: 0; width: 100%;
    background: #D4AF37; color: #000; text-align: center;
    padding: 8px 15px; font-size: 14px; font-weight: bold;
    letter-spacing: 1px; z-index: 9999;
  }
  .work-banner a { color: #000; text-decoration: underline; }

  header {
    position: fixed; top: 35px; width: 100%;
    background: rgba(5,5,5,0.95); border-bottom: 1px solid #D4AF37;
    z-index: 100; padding: 15px 40px;
    display: flex; align-items: center; justify-content: space-between;
    backdrop-filter: blur(10px);
  }
  header .logo { font-size: 20px; letter-spacing: 4px; color: #D4AF37; text-transform: uppercase; font-weight: bold; }
  header nav a {
    color: #ccc; text-decoration: none; margin-left: 25px;
    font-size: 14px; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s;
  }
  header nav a:hover, header nav a.active { color: #D4AF37; text-shadow: 0 0 10px #D4AF37; }

  section { max-width: 1200px; margin: 0 auto; padding: 140px 40px 80px; }

  section h2 {
    font-size: 42px; color: #D4AF37; letter-spacing: 6px;
    text-transform: uppercase; margin-bottom: 40px;
    border-bottom: 1px solid #D4AF37; padding-bottom: 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
  }

  .book-card {
    background: #0a0a0a; border: 1px solid #D4AF37; border-radius: 12px;
    overflow: hidden; box-shadow: 0 0 20px rgba(212,175,55,0.15);
    transition: 0.3s; display: flex; flex-direction: column;
  }
  .book-card:hover {
    box-shadow: 0 0 35px rgba(212,175,55,0.45);
    transform: translateY(-5px);
  }

  .book-card .cover {
    width: 100%; aspect-ratio: 3 / 4; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    border-bottom: 1px solid #D4AF37;
    color: #D4AF37; font-size: 48px; letter-spacing: 4px;
  }
  .book-card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .book-card .content { padding: 20px; display: flex; flex-direction: column; flex: 1; }

  .book-card h3 {
    font-size: 20px; color: #D4AF37; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .book-card .genre {
    color: #888; font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 15px;
  }

  .btn {
    display: inline-block; margin-top: auto; padding: 10px 20px;
    background: #D4AF37; color: #000; text-decoration: none;
    font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
    border-radius: 6px; transition: 0.3s; border: none; cursor: pointer;
    font-family: inherit; font-size: 13px; text-align: center;
  }
  .btn:hover { background: #ff2a2a; color: #fff; box-shadow: 0 0 20px #ff2a2a; }

  footer {
    text-align: center; padding: 40px 20px; border-top: 1px solid #D4AF37;
    color: #666; font-size: 14px; letter-spacing: 2px; margin-top: 80px;
  }

  @media (max-width: 768px) {
    header { flex-direction: column; padding: 10px; }
    header nav a { margin: 5px 10px; font-size: 12px; }
    section h2 { font-size: 28px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="work-banner">✨ Phantom v1.4 уже доступен — <a href="https://github.com/Cherep645242433/phantomroadstudio.github.io/releases/latest" target="_blank">Скачать</a> ✨</div>

    <a href="index.html#catalog">Каталоги</a>
    <a href="index.html#contacts">Контакты</a>
  </nav>
</header>

<section>
  <h2>Книги</h2>
  <div class="grid">

    <div class="book-card">
      <div class="cover"><img src="book-nws.png" alt="NWS"></div>
      <div class="content">
        <h3>NWS (Need World Speed)</h3>

        <a href="book-nws.html" class="btn">Читать</a>
      </div>
    </div>

  </div>
</section>

<footer>
  © 2026 Phantom Road Studio. Все права защищены.
</footer>

</body>
</html>
